name = "sonicvault-ai"
main = "worker.js"
compatibility_date = "2026-04-02"

# Keep request logs in the dashboard for debugging AI calls.
[observability]
enabled = true

# Run in the US, not the data centre nearest the visitor. Cloudflare sends
# traffic from the Philippines to Hong Kong, and Anthropic (and Gemini)
# refuse calls from there: 403 "Request not allowed". A region rather than
# host = "api.anthropic.com" because that host is anycast, so it would
# measure nearest from Hong Kong too.
[placement]
region = "aws:us-east-1"

# Workers AI, for POST /transcribe (Whisper word timings for lyric sync) and
# POST /cover (FLUX.1 [schnell] covers for songs made on the Create page).
[ai]
binding = "AI"

# Plays and hearts on share links (POST /listen from share pages, GET-like
# POST /listens for the owner): one row per event, visitors as a daily-
# changing hash, never an address.
[[d1_databases]]
binding = "LISTENS"
database_name = "sonicvault-listens"
database_id = "e91d78d4-94fd-4e3d-9bb8-cd2bb1106d4a"

# Secrets (set with `wrangler secret put <NAME>`, never commit these):
#   ANTHROPIC_API_KEY        required — Anthropic API key the worker calls Claude with
#   SONICVAULT_CLIENT_TOKEN  required — bearer token the web UI must send as Authorization;
#                            without it every token route answers 401
#
# Daily spend cap (table ai_usage in LISTENS, made by the worker): Claude
# calls weigh 1 for Haiku and 10 for larger models against CLAUDE_DAILY_LIMIT
# (default 1000), Lyria songs against LYRIA_DAILY_LIMIT (default 20). Set
# either as a var to change it.
#   GEMINI_API_KEY           optional — Google AI Studio key for POST /generate (Lyria songs);
#                            the key's project needs billing turned on
#   VAPID_PRIVATE_KEY        optional — the private VAPID key (base64url) that signs follower notices
#
# Vars below are non-secret and safe to keep in source control.
[vars]
# Comma-separated origin allowlist for CORS. The deployed app plus local dev.
ALLOWED_ORIGIN = "https://bobbynacario-design.github.io,http://localhost:8487,http://127.0.0.1:8487"
# Share-link previews (share.js): where people are sent on to, and the
# Firestore project whose public share records the previews read.
SHARE_APP_URL = "https://bobbynacario-design.github.io/sonicvault"
FIRESTORE_PROJECT = "pokerhq-a67e4"
# Web Push for followers (POST /follow, /notify): the public half of the VAPID
# key the worker signs notices with (the private half is the secret
# VAPID_PRIVATE_KEY), and who the push services see as the sender.
VAPID_PUBLIC_KEY = "BFPpQ0izrCr3rZarBA-qK4cQSnweV990bbhV6NEAr23Ff84fl1KQj2sqTZaTc61SYDryT_I0AHB4CaYzGO_mGIA"
VAPID_SUBJECT = "https://bobbynacario-design.github.io/sonicvault"
